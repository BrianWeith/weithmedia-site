<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weith Media | Real Estate Photography &amp; Video</title>
  <meta name="description" content="Professional real estate photography, video, floor plans, and virtual staging. Transparent pricing, fast turnaround." />
  <link rel="icon" href="Logo/Weith Media - Circle Logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── NAVIGATION ── -->
  <nav id="navbar">
    <div class="nav-inner">
      <a href="#hero" class="nav-brand">
        <img src="Logo/Weith Media - Full Logo.png" alt="Weith Media" />
      </a>
      <button class="hamburger" id="hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact" class="nav-cta">Book Now</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── HERO ── -->
  <section id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-eyebrow" data-c="hero-eyebrow"></p>
      <h1 data-c="hero-heading"></h1>
      <p class="hero-sub" data-c="hero-sub"></p>
      <a href="#contact" class="btn-white" data-c="hero-cta"></a>
    </div>
  </section>

  <!-- ── SERVICES ── -->
  <section id="services">
    <div class="container">
      <h2 data-c="services-heading"></h2>
      <p class="section-sub" data-c="services-sub"></p>
      <div class="services-grid" id="services-grid"></div>
      <div class="addons-block">
        <h3 data-c="addons-heading"></h3>
        <div class="addons-list" id="addons-list"></div>
      </div>
    </div>
  </section>

  <!-- ── GALLERY ── -->
  <section id="gallery">
    <div class="container">
      <h2 data-c="gallery-heading"></h2>
      <p class="section-sub" data-c="gallery-sub"></p>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </section>

  <!-- ── ABOUT ── -->
  <section id="about">
    <div class="container about-grid">
      <div class="about-image">
        <!-- To update: replace images/about.jpg with your new export -->
        <img id="about-img" src="images/about.jpg" alt="Weith Media photography" />
      </div>
      <div class="about-text">
        <h2 data-c="about-heading"></h2>
        <div id="about-paragraphs"></div>
        <a href="#contact" class="btn-primary" data-c="about-cta"></a>
      </div>
    </div>
  </section>

  <!-- ── CONTACT ── -->
  <section id="contact">
    <div class="container contact-inner">
      <h2 data-c="contact-heading"></h2>
      <p class="section-sub" data-c="contact-sub"></p>
      <div id="contact-methods" class="contact-methods"></div>
      <p class="contact-note" data-c="contact-note"></p>
    </div>
  </section>

  <!-- ── FOOTER ── -->
  <footer>
    <div class="container footer-inner">
      <!-- White swoosh mark (no circle, no wordmark) -->
      <img src="Logo/Weith Media - Swoosh Logo.png" alt="Weith Media" class="footer-logo" />
      <p data-c="footer-copy"></p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
